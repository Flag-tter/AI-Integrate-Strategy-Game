<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>World Strategy Simulator</title>

<!--
  ============================================================================
  WORLD STRATEGY SIMULATOR — single-file build
  ============================================================================
  This file is the FIRST PASS of a much larger spec. It is meant to be handed
  from one Claude instance to the next, over many sessions, until the full
  vision is realized. Read the giant comment block at the top of the
  <script type="module"> tag near the bottom of this file before changing
  anything — it is a handoff letter written for you, the next Claude.
============================================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    /* ---- design tokens ------------------------------------------------ */
    --bg:        #0A0C10;
    --bg-2:      #0D1017;
    --panel:     #12151C;
    --panel-2:   #171B24;
    --border:    #232838;
    --border-2:  #2C3245;
    --text:      #E6E9EF;
    --muted:     #8992A6;
    --muted-2:   #5C6479;
    --amber:     #E0A458;
    --cyan:      #3FC1C9;
    --good:      #4FD1A5;
    --bad:       #E1595A;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{ background:var(--amber); color:#0A0C10; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }

  /* ---- utility -------------------------------------------------------- */
  .hidden{ display:none !important; }
  .mono{ font-family:var(--font-mono); }
  .muted{ color:var(--muted); }

  /* =====================================================================
     AUTH SCREEN
  ===================================================================== */
  #authScreen{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(63,193,201,0.08), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(224,164,88,0.06), transparent 55%),
      var(--bg);
    padding:24px;
  }
  #authCard{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:32px 28px;
  }
  #authCard h1{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  #authCard p.tag{
    margin:0 0 24px;
    color:var(--muted);
    font-size:13px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    color:var(--text);
    font-size:14px;
    outline:none;
  }
  .field input:focus{ border-color:var(--cyan); }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:11px 14px;
    border-radius:8px;
    border:1px solid var(--border-2);
    background:var(--panel-2);
    color:var(--text);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{ border-color:var(--cyan); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--cyan); color:#07171A; border-color:var(--cyan); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; }
  .authRow{ display:flex; gap:8px; margin-top:14px; }
  #authError{
    color:var(--bad); font-size:12.5px; margin-top:10px; min-height:16px;
  }
  #authDivider{
    display:flex; align-items:center; gap:10px; margin:18px 0;
    color:var(--muted-2); font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  }
  #authDivider::before,#authDivider::after{ content:''; flex:1; height:1px; background:var(--border); }

  /* =====================================================================
     APP SHELL
  ===================================================================== */
  #app{
    height:100%;
    display:grid;
    grid-template-rows:52px 1fr 44px;
    grid-template-columns:1fr;
  }

  /* ---- topbar ---------------------------------------------------------*/
  #topbar{
    grid-row:1;
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  #brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  #brand .dot{
    width:7px; height:7px; border-radius:50%; background:var(--good);
    box-shadow:0 0 8px var(--good);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.35;} }

  #mapModes{ display:flex; gap:4px; margin-left:8px; }
  .modeBtn{
    background:transparent; border:1px solid var(--border);
    color:var(--muted); font-size:12px; padding:6px 10px; border-radius:6px;
    cursor:pointer; white-space:nowrap;
  }
  .modeBtn.active{ color:var(--cyan); border-color:var(--cyan); background:rgba(63,193,201,.08); }
  .modeBtn[disabled]{ opacity:.35; cursor:not-allowed; }

  #topSpacer{ flex:1; }
  #dateReadout{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--amber);
    white-space:nowrap;
  }
  #userBadge{
    font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px;
  }
  #signOutBtn{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-size:11px; padding:5px 9px; border-radius:6px; cursor:pointer;
  }

  /* ---- main layout ------------------------------------------------------ */
  #main{
    grid-row:2;
    display:grid;
    grid-template-columns:1fr 340px;
    min-height:0;
  }
  @media (max-width:820px){
    #main{ grid-template-columns:1fr; grid-template-rows:1fr auto; }
    #sidePanel{ max-height:42vh; }
  }

  /* ---- map panel ------------------------------------------------------- */
  #mapPanel{
    position:relative;
    min-width:0;
    min-height:0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(63,193,201,0.05), transparent 55%),
      var(--bg-2);
    overflow:hidden;
  }
  #worldMap{ width:100%; height:100%; display:block; cursor:grab; }
  #worldMap:active{ cursor:grabbing; }
  .land{ fill:var(--panel-2); stroke:var(--border); stroke-width:.5; }
  .land.sim{ cursor:pointer; }
  .land.selected{ stroke:var(--amber); stroke-width:1.6; }
  .land.atWar{ stroke:var(--bad); stroke-width:1.6; animation: warPulse 1.6s ease-in-out infinite; }
  .land:hover{ filter:brightness(1.25); }
  @keyframes warPulse{ 0%,100%{ stroke-opacity:1; } 50%{ stroke-opacity:.3; } }
  .capitalNode{ cursor:pointer; }
  .capitalNode circle.core{ fill:var(--cyan); }
  .capitalNode circle.ring{
    fill:none; stroke:var(--cyan); stroke-width:1px; opacity:.7;
    animation:radar 2.6s ease-out infinite;
    transform-origin:center;
  }
  @keyframes radar{
    0%{ r:2px; opacity:.65; }
    100%{ r:11px; opacity:0; }
  }
  .allyLine{ stroke:var(--good); stroke-width:.6; opacity:.35; fill:none; stroke-dasharray:2 3; }
  .rivalLine{ stroke:var(--bad); stroke-width:.6; opacity:.28; fill:none; stroke-dasharray:1 4; }

  #newsTicker{
    position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(0deg, rgba(10,12,16,.92), rgba(10,12,16,.55));
    border-top:1px solid var(--border);
    padding:8px 14px;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
  }
  #newsTicker b{ color:var(--amber); font-weight:600; }
  #newsTicker span#tickerInner{
    display:inline-block;
    padding-left:100%;
    animation:ticker 38s linear infinite;
  }
  @keyframes ticker{ 0%{ transform:translateX(0);} 100%{ transform:translateX(-100%);} }

  #mapHint{
    position:absolute; top:10px; left:12px;
    font-size:11px; color:var(--muted-2);
    background:rgba(18,21,28,.6); padding:4px 8px; border-radius:6px;
    pointer-events:none;
  }

  /* ---- side panel -------------------------------------------------------*/
  #sidePanel{
    border-left:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #tabs{ display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
  .tabBtn{
    flex:1; background:transparent; border:none; color:var(--muted);
    padding:11px 4px; font-size:12px; cursor:pointer; border-bottom:2px solid transparent;
    text-transform:uppercase; letter-spacing:.06em;
  }
  .tabBtn.active{ color:var(--text); border-bottom-color:var(--cyan); }
  #tabContent{ flex:1; overflow-y:auto; padding:16px; min-height:0; }
  #tabContent::-webkit-scrollbar{ width:6px; }
  #tabContent::-webkit-scrollbar-thumb{ background:var(--border-2); border-radius:3px; }

  .statRow{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0; border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .statRow .k{ color:var(--muted); }
  .statRow .v{ font-family:var(--font-mono); }
  .statRow .v.up{ color:var(--good); }
  .statRow .v.down{ color:var(--bad); }

  .panelTitle{
    font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 3px;
  }
  .panelSub{ font-size:12px; color:var(--muted); margin:0 0 16px; }

  .barTrack{ height:5px; background:var(--bg-2); border-radius:3px; overflow:hidden; margin-top:5px; }
  .barFill{ height:100%; background:var(--cyan); }

  .newsItem{
    padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px; line-height:1.4;
  }
  .newsItem .when{ color:var(--muted-2); font-family:var(--font-mono); font-size:11px; display:block; margin-bottom:2px; }

  .emptyState{ color:var(--muted-2); font-size:12.5px; text-align:center; padding:30px 10px; }

  /* Active-condition badges on the Country tab (see § EVENTS cascade) */
  .condRow{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .condBadge{
    font-size:11px; font-family:var(--font-mono); color:var(--amber);
    border:1px solid var(--border-2); background:var(--panel-2);
    border-radius:999px; padding:3px 10px;
  }

  /* ---- bottom controls --------------------------------------------------*/
  #controls{
    grid-row:3;
    display:flex; align-items:center; gap:10px;
    padding:0 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
  }
  #playBtn{
    width:30px; height:30px; border-radius:50%;
    background:var(--cyan); border:none; color:#07171A; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    flex-shrink:0;
  }
  #speedRow{ display:flex; gap:4px; }
  .speedBtn{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-size:11px; padding:4px 9px; border-radius:6px; cursor:pointer; font-family:var(--font-mono);
  }
  .speedBtn.active{ color:var(--amber); border-color:var(--amber); }
  #controlsSpacer{ flex:1; }
  #saveBtn, #newWorldBtn{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-size:11.5px; padding:6px 11px; border-radius:6px; cursor:pointer;
  }
  #saveStatus{ font-size:11px; color:var(--muted-2); font-family:var(--font-mono); min-width:90px; }

  @media (max-width:520px){
    #brand span.full{ display:none; }
    #dateReadout{ font-size:11px; }
    #userBadge span.email{ display:none; }
  }
</style>
</head>
<body>

  <!-- ===================================================================
       AUTH SCREEN
  =================================================================== -->
  <div id="authScreen">
    <div id="authCard">
      <h1>World Strategy Simulator</h1>
      <p class="tag">A living world. You only watch.</p>

      <div class="field">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="passInput">Password</label>
        <input id="passInput" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>

      <div class="authRow">
        <button class="btn primary" id="signInBtn">Sign In</button>
        <button class="btn ghost" id="signUpBtn">Create Account</button>
      </div>

      <div id="authDivider">or</div>

      <button class="btn" id="anonBtn">Continue Anonymously</button>
      <div id="authError"></div>
    </div>
  </div>

  <!-- ===================================================================
       MAIN APP
  =================================================================== -->
  <div id="app" class="hidden">

    <header id="topbar">
      <div id="brand"><span class="dot"></span><span class="full">WORLD STRATEGY SIM</span></div>

      <div id="mapModes">
        <button class="modeBtn active" data-mode="political">Political</button>
        <button class="modeBtn" data-mode="economic">Economic</button>
        <button class="modeBtn" data-mode="military">Military</button>
        <button class="modeBtn" data-mode="tech">Tech</button>
        <button class="modeBtn" data-mode="trade">Trade</button>
        <button class="modeBtn" data-mode="climate" disabled title="TODO: next Claude — needs a real climate/emissions data model, not a proxy stat">Climate</button>
      </div>

      <div id="topSpacer"></div>
      <div id="dateReadout" class="mono">Y1 Q1</div>
      <div id="userBadge">
        <span class="email"></span>
        <button id="signOutBtn">Sign out</button>
      </div>
    </header>

    <main id="main">
      <div id="mapPanel">
        <div id="mapHint">scroll to zoom · drag to pan · click a country</div>
        <svg id="worldMap"></svg>
        <div id="newsTicker"><span id="tickerInner" class="mono">Loading world…</span></div>
      </div>

      <aside id="sidePanel">
        <div id="tabs">
          <button class="tabBtn active" data-tab="world">World</button>
          <button class="tabBtn" data-tab="country">Country</button>
          <button class="tabBtn" data-tab="timeline">Timeline</button>
        </div>
        <div id="tabContent"></div>
      </aside>
    </main>

    <footer id="controls">
      <button id="playBtn">▶</button>
      <div id="speedRow">
        <button class="speedBtn" data-speed="1">1×</button>
        <button class="speedBtn active" data-speed="2">2×</button>
        <button class="speedBtn" data-speed="4">4×</button>
        <button class="speedBtn" data-speed="8">8×</button>
      </div>
      <div id="controlsSpacer"></div>
      <span id="saveStatus"></span>
      <button id="newWorldBtn">New World</button>
      <button id="saveBtn">Save Now</button>
    </footer>
  </div>

<script type="module">
/* ============================================================================
   ██╗  ██╗ █████╗ ███╗   ██╗██████╗  ██████╗ ███████╗███████╗
   ██║  ██║██╔══██╗████╗  ██║██╔══██╗██╔═══██╗██╔════╝██╔════╝

   ██║  ██║██║  ██║██║ ╚████║██████╔╝╚██████╔╝██║     ██║
   ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝╚═════╝  ╚═════╝ ╚═╝     ╚═╝

   NOTE TO THE NEXT CLAUDE (and the one after you, and so on)
   ============================================================================

   You are inheriting a project. A human is building "World Strategy Simulator"
   — a single-HTML-file, AI-driven world simulation, per the full spec they
   originally provided (country AI, deep economy, diplomacy, emergent history,
   a beautiful animated map, hundreds of countries, thousands of simulated
   years). That full vision is BIG — realistically a multi-month project even
   for a human team. This file is a working FIRST PASS, not the finished
   product. Your job is to move it forward, then leave equally clear notes
   for whoever comes after you. Treat this comment block as a living document:
   update it before you hand off, the same way I'm updating it for you now.

   *** EXPLICIT INSTRUCTION FROM THE HUMAN, DO NOT LOSE THIS ***
   The human has directly said: they want EVERYTHING in the original spec
   completed — not a permanently-scoped-down scaffold, not "good enough."
   The section-by-section spec they gave (reproduced in full further down
   this comment, under "ORIGINAL FULL SPEC") is the actual target, not
   inspiration to loosely riff on. Every session should leave the project
   measurably closer to that full spec, not just polish what already exists.
   Do NOT declare this "done" or imply the vision has been scaled back —
   if you make a scoping call for a single session (you will have to; the
   full spec can't land in one sitting), say so plainly to the human as a
   "for now" decision, not a final one, and put it back on the TODO list
   below rather than quietly dropping it. When in doubt about whether
   something in the spec still needs doing, assume yes and either do it or
   log it explicitly — never assume it's been silently descoped.

   ---- SESSION LOG (most recent first) --------------------------------------
   Session N+7 (this session): closed BOTH remaining named gaps from the
   § INTELLIGENCE TODO list — war-noise memory/decay, and estimate
   persistence across ticks:
     - New `recentWarFog` field per country ({targetIso: ticksSinceWarEnded}),
       seeded on both sides in `resolveWar()` (§ WAR) and counted down each
       tick by new `tickIntelDecay()` (called from `tick()`, § SIMULATION
       ENGINE). `intelNoiseMagnitude()` (§ INTELLIGENCE) now adds a residual
       war-fog penalty that decays LINEARLY to 0 over
       `INTEL.warFogDecayTicks` (12 ticks) instead of clearing the instant
       `atWarWith` does — intel on a country you just fought stays extra
       noisy for about 3 in-sim years after the war ends.
     - New `getRivalEstimate(observer, target)` in § INTELLIGENCE: caches
       each country's last noisy read on a given rival
       (`{tick, military, stability}`) and reuses it as-is until it's
       `INTEL.reportRefreshTicks` (4 ticks) old, then re-rolls. All three
       fog-of-war call sites — `warProvocationChance()` (§ WAR),
       `estimatedThreatLevel()` (§ COUNTRY AI), `updateDiplomacy()`'s
       `diplomacy_outreach` payoff (§ SIMULATION ENGINE) — now read through
       this cache instead of calling `estimateStat()`/`estimateRival()`
       directly, so a country can act on the same (possibly wrong, possibly
       stale) belief across a run of ticks instead of the noise re-rolling
       and self-averaging on every single call.
     - `intelCache` / `recentWarFog` added to `initNewWorld()` and backfilled
       in `migrateWorld()`, per the standing instruction to keep old saves
       from silently missing new fields.
     - This closes out the § INTELLIGENCE section's TODO list in full — as
       of this session every named fog-of-war gap from the last several
       handoffs is closed. The one thing NOT done: none of this is visible
       in the UI yet (no "intel report age" or "lingering war fog" badge on
       the Country tab) — logged as a fresh TODO in § INTELLIGENCE and in
       "WHAT IS DELIBERATELY STUBBED" below, not silently skipped.
     - Did NOT touch: internal government factions, coalitions/multi-front
       war, army/navy/air/cyber/nuclear breakdown, territory change, climate
       map mode, trade-route/shipping-lane visuals, multi-save-slot UI,
       interest-rate lever, deeper event cascades. These remain the next
       highest-value items — see "WHAT IS DELIBERATELY STUBBED" below.
     - Verified: `node --check` on the extracted module script (by line
       number, not a naive regex grab of "<script type=module") passes
       clean. Manually traced `intelNoiseMagnitude()` by hand for a country
       0/6/12 ticks removed from a war with the same target to confirm the
       penalty decays 0.08 -> 0.04 -> 0.00 as designed, and traced
       `getRivalEstimate()` across 5 consecutive ticks to confirm it returns
       the identical cached object for ticks 1-3 after a refresh and rolls a
       new one on tick 4.

   Session N+6: closed the one remaining named gap from the
   § INTELLIGENCE TODO list — `updateDiplomacy()` still reasoning about true
   stats instead of noisy ones:
     - `updateDiplomacy(iso, policy)` now gates the `diplomacy_outreach`
       trust bump on the initiator's ESTIMATED read of the target's
       stability (`estimateStat()`, § INTELLIGENCE) rather than a flat
       +0.01 applied identically regardless of who the target is. Range is
       now roughly +0.004..+0.016 depending on the (possibly wrong)
       believed stability, versus the old flat bonus — a country that
       misjudges an unstable target as stable will over-invest in that
       relationship, a genuine fog-of-war mistake, not a scripted one.
     - This closes out every call site named across the last two sessions'
       § INTELLIGENCE TODOs: war-declaration confidence (Session N+3),
       invest_military's threat term (Session N+5), and now
       diplomacy_outreach (this session) all read estimates, never true
       stats.
     - Did NOT touch: internal government factions, coalitions/multi-front
       war, army/navy/air/cyber/nuclear breakdown, territory change,
       climate map mode, trade routes/shipping-lane visuals, multi-save-
       slot UI, interest-rate lever, war-noise memory/decay after a war
       ends, estimate persistence across ticks. These remain the next
       highest-value items — see "WHAT IS DELIBERATELY STUBBED" below.
     - Verified: `node --check` on the extracted module script (by line
       number, not a naive regex grab of "<script type=module") passes
       clean. Manually traced `updateDiplomacy()`'s new branch by hand for
       believedStability at 0, 0.5, and 1 to confirm the delta stays
       within the intended ~0.004..0.016 band before the region bonus.

   Session N+5: closed both items the § INTELLIGENCE
   section's own TODO named — relation/war-aware intel quality, and
   threading estimates (not true stats) into an ongoing policy decision,
   not just the one-off war-declaration roll:
     - `intelNoiseMagnitude(observer, targetIso)` replaces the old flat
       tech-only noise formula. Still starts from the observer's own tech
       (unchanged baseline), but now also: a genuinely trusting relation
       with the target (> 0.3) sharpens the read (info-sharing between
       friendly states), while being at war with that SPECIFIC target
       thickens the fog (active-conflict intel is noisier, not better).
       Verified with a standalone harness (see below): avg noise ~0.077 at
       relation 0.9 vs ~0.18 neutral vs ~0.26 while at war with the target

   World Strategy Simulator — Complete Project Specification (Simulation First)

   PROJECT VISION: Build a living, AI-driven world simulation where countries
   evolve naturally over hundreds or thousands of simulated years. The
   player's role is to observe. The simulation itself is the game. Single-
   player. Priorities: realistic country AI, realistic geopolitics, beautiful
   visuals, smooth animations, emergent history, long-term simulation,
   stability, performance.

   PLATFORM: desktop, laptop, iPad, iPhone. Fully responsive, auto-scales to
   every screen size, no horizontal scrolling, touch/mouse/keyboard friendly,
   landscape and portrait where practical.

   TECHNICAL: everything in ONE HTML FILE (HTML+CSS+JS). GitHub Pages
   compatible. No backend server other than Firebase. Modern-browser, Mobile
   Safari, Chrome, Firefox, Edge compatible. Code organized into clearly
   separated JS sections despite being one file.

   FIREBASE: config inserted later, never hardcode credentials (note: the
   human has since given a real config directly in-chat — see firebaseConfig
   above; that supersedes this line for this project, but keep the general
   principle in mind if this ever becomes a template for others). Firebase
   Authentication: Email/Password + Anonymous. Cloud Firestore stores: user
   accounts, saved worlds, simulation saves, world settings, historical
   timelines, statistics, user preferences. Do NOT use Firebase Storage.
   Everything should save automatically.

   DEVELOPMENT PHILOSOPHY: not the largest simulator — the most believable
   one to watch. Priority order: 1) realistic country behavior, 2) strong
   simulation performance, 3) high-quality map visuals, 4) historical
   plausibility, 5) reliable save/load, 6) additional features. Anything
   that doesn't serve realism/simulation quality/visualization is low
   priority.

   CORE PHILOSOPHY: the AI should never intentionally create interesting
   stories. Every country always attempts the best long-term decision for
   itself based on its own interests, information, resources, geography,
   history, and situation. Interesting stories emerge naturally. Nothing
   happens simply because history says it should; nothing unrealistic
   happens without believable causes.

   HISTORICAL REALISM: simulation begins with realistic modern-world
   conditions. Each country starts with realistic population, economy, GDP,
   education, natural resources, military, technology, government, trade,
   industry, infrastructure, agriculture, geography, energy, political
   stability, culture, religion, diplomatic relationships, historical
   rivalries, historical alliances. Countries feel unique from the start.

   NATIONAL IDENTITY: each country has long-term strategic tendencies (e.g.
   US: global influence, advanced tech, large military, alliance building,
   strong trade; China: manufacturing, infrastructure, economic growth,
   long-term planning, regional influence; Russia: strategic security,
   military strength, resource exports, regional influence; Japan: tech,
   exports, education, industrial production; Saudi Arabia: energy exports,
   resource management, regional influence; Brazil: agriculture, mining,
   environmental pressures). These are strategic preferences, not scripted
   behaviors — countries may evolve if circumstances genuinely change.

   AI DECISION MAKING: every country continuously evaluates economy,
   military, trade, population, food, water, energy, diplomacy, technology,
   climate, internal politics, global events, infrastructure, education,
   healthcare, employment, public opinion, historical memory, national
   security — balancing long-term and short-term priorities.

   INTERNAL GOVERNMENT SIMULATION: countries are not controlled by a single
   decision-maker. Each nation contains competing interests: government,
   military, businesses, scientists, political parties, citizens, religious
   organizations, regional governments, media. Policies emerge from
   balancing competing pressures.

   LEADER SIMULATION: leaders have personalities and priorities (economist,
   scientist, military leader, nationalist, environmentalist, isolationist,
   globalist, reformer, traditionalist, corrupt leader, charismatic leader).
   Leaders influence priorities rather than giving simple numerical bonuses.

   DIPLOMACY: long-term relationships tracking trust, respect, fear,
   competition, dependence, trade, military cooperation, historical
   grievances, border disputes, sanctions, aid, espionage. Countries
   remember previous events for decades. Relationships improve/deteriorate
   naturally.

   ECONOMY: deep and interconnected — GDP, inflation, interest rates, debt,
   government spending, private investment, consumer spending, imports,
   exports, manufacturing, agriculture, mining, finance, technology, energy,
   employment, currencies, supply chains. Countries specialize naturally.
   Global trade matters. Economic crises spread internationally.

   ECONOMIC SECTORS: instead of individual companies, countries contain
   major sectors — technology, manufacturing, agriculture, energy, mining,
   finance, transportation, construction, services. Sector performance
