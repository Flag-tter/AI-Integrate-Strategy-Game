      stats:{ population:0.6, gdp:2.4, military:0.1, tech:0.3, stability:0.7, education:0.62, energy:0.35, tradeOpenness:0.58 } },
    "174": { name:"Comoros", iso:"174", region:"Africa",
      identity:{ military:0.1, tech:0.15, trade:0.4, diplomacy:0.4, isolation:0.4 },
      stats:{ population:0.87, gdp:1.4, military:0.1, tech:0.15, stability:0.45, education:0.42, energy:0.25, tradeOpenness:0.4 } },
    "678": { name:"Sao Tome and Principe", iso:"678", region:"Africa",
      identity:{ military:0.05, tech:0.15, trade:0.4, diplomacy:0.45, isolation:0.4 },
      stats:{ population:0.23, gdp:0.65, military:0.05, tech:0.15, stability:0.55, education:0.5, energy:0.25, tradeOpenness:0.4 } },
    "690": { name:"Seychelles", iso:"690", region:"Africa",
      identity:{ military:0.1, tech:0.35, trade:0.65, diplomacy:0.55, isolation:0.2 },
      stats:{ population:0.11, gdp:1.9, military:0.1, tech:0.35, stability:0.75, education:0.7, energy:0.35, tradeOpenness:0.62 } },
  };

  /* ==========================================================================
     § WORLD STATE
     The single mutable object the whole simulation reads and writes. Kept
     flat and JSON-serializable on purpose (this is exactly what gets saved
     to Firestore).
  ========================================================================== */
  let world = null; // populated by initNewWorld() or loadWorld()

  function initNewWorld() {
    const countries = {};
    for (const iso in COUNTRY_DATA) {
      countries[iso] = JSON.parse(JSON.stringify(COUNTRY_DATA[iso])); // deep clone, mutable copy
      countries[iso].conditions = {}; // active situational flags (drought, unrest, recession, ...)
                                       // durations in ticks; see § EVENTS / tickConditions()
      countries[iso].stats.priceLevel = 1.0; // NEW this session: inflation-like price index,
                                              // 1.0 = baseline. See § SIMULATION ENGINE
                                              // computeInflation() and § EVENTS food_shortage.
      countries[iso].influenceGains = 0; // NEW this session: counts times this country has
                                          // benefited from a rival's crisis, see § EVENTS.
      countries[iso].atWarWith = null; // NEW this session: iso of current war opponent, or
                                        // null. See § WAR. One war at a time, deliberately.
      countries[iso].warsFought = 0;   // NEW this session: lifetime war counters, see § WAR.
      countries[iso].warsWon = 0;
      countries[iso].intelFailures = 0; // counts wars this country started and then lost —
                                         // a fog-of-war miscalculation, see § INTELLIGENCE
                                         // and resolveWar().
      countries[iso].intelCache = {};   // NEW this session: cached per-target rival estimates
                                         // ({iso: {tick,military,stability}}), see
                                         // getRivalEstimate() in § INTELLIGENCE.
      countries[iso].recentWarFog = {}; // NEW this session: {iso: ticksSinceWarEnded} — lingering
                                         // post-war intel fog that decays over time, see
                                         // intelNoiseMagnitude()/tickIntelDecay() in § INTELLIGENCE.
    }
    const relations = {};
    const isos = Object.keys(countries);
    for (const a of isos) {
      relations[a] = {};
      for (const b of isos) {
        if (a === b) continue;
        // seed relations loosely by region (same region = friendlier prior)
        const sameRegion = countries[a].region === countries[b].region;
        relations[a][b] = sameRegion ? 0.15 : 0;
      }
    }
    return {
      year: SIM.startYear,
      quarter: 1,
      countries,
      relations,
      newsLog: [],
      selectedIso: null,
      ticks: 0,
      wars: [], // NEW this session: active wars, see § WAR
    };
  }

  // Brings an older saved world up to date with additions made in later
  // sessions, so existing players don't get stuck on a stale snapshot:
  //   - adds any COUNTRY_DATA entries (e.g. this session's batch 5) that
  //     didn't exist yet when the save was made, wiring fresh relations too
  //   - ensures every country has a `conditions` object (added this session)
  // TODO(next-claude): keep extending this every time you add a structural
  // field to country objects or COUNTRY_DATA grows — this is the one place
  // that keeps old saves from silently missing new content.
  function migrateWorld(w) {
    for (const iso in COUNTRY_DATA) {
      if (!w.countries[iso]) {
        w.countries[iso] = JSON.parse(JSON.stringify(COUNTRY_DATA[iso]));
        w.countries[iso].conditions = {};
        w.countries[iso].atWarWith = null;
        w.countries[iso].warsFought = 0;
        w.countries[iso].warsWon = 0;
        w.countries[iso].intelFailures = 0;
      }
    }
    for (const iso in w.countries) {
      if (!w.countries[iso].conditions) w.countries[iso].conditions = {};
      // NEW this session: backfill inflation-like price index for saves
      // made before computeInflation() existed.
      if (typeof w.countries[iso].stats.priceLevel !== 'number') {
        w.countries[iso].stats.priceLevel = 1.0;
      }
      // NEW this session: rival-influence tracking (see § EVENTS,
      // "rival gains influence" mechanic) — a lightweight counter so the
      // UI/news can eventually reference how often a country has profited
      // from a rival's crisis. Not load-bearing for the simulation math.
      if (typeof w.countries[iso].influenceGains !== 'number') {
        w.countries[iso].influenceGains = 0;
      }
      // NEW this session: backfill war-system fields (see § WAR) for saves
      // made before the war system existed.
      if (w.countries[iso].atWarWith === undefined) w.countries[iso].atWarWith = null;
      if (typeof w.countries[iso].warsFought !== 'number') w.countries[iso].warsFought = 0;
      if (typeof w.countries[iso].warsWon !== 'number') w.countries[iso].warsWon = 0;
      // backfill the fog-of-war miscalculation counter (see § INTELLIGENCE)
      // for saves made before it existed.
      if (typeof w.countries[iso].intelFailures !== 'number') w.countries[iso].intelFailures = 0;
      // NEW this session: backfill the intel-persistence/war-fog-decay
      // fields (see § INTELLIGENCE) for saves made before this session.
      if (!w.countries[iso].intelCache || typeof w.countries[iso].intelCache !== 'object') {
        w.countries[iso].intelCache = {};
      }
      if (!w.countries[iso].recentWarFog || typeof w.countries[iso].recentWarFog !== 'object') {
        w.countries[iso].recentWarFog = {};
      }
    }
    if (!Array.isArray(w.wars)) w.wars = []; // NEW this session, see § WAR
    w.relations = w.relations || {};
    const isos = Object.keys(w.countries);
    for (const a of isos) {
      w.relations[a] = w.relations[a] || {};
      for (const b of isos) {
        if (a === b) continue;
        if (w.relations[a][b] === undefined) {
          const sameRegion = w.countries[a].region === w.countries[b].region;
          w.relations[a][b] = sameRegion ? 0.15 : 0;
        }
      }
    }
    return w;
  }

  /* ==========================================================================
     § COUNTRY AI
     Simple utility-based policy selection. Each candidate policy gets a
     score built from the country's identity weights plus its current
     situational pressures (e.g. low stability boosts the appeal of internal
     investment). The AI does NOT know it's supposed to make history — it's
     just maximizing a locally-reasonable score every quarter. Emergent
     behavior is supposed to come from many countries doing this at once
     plus random shocks, per the spec's core philosophy.

     NEW this session: invest_military now includes a real THREAT term —
     `estimatedThreatLevel()` returns the country's NOISY ESTIMATE (see
     § INTELLIGENCE) of its most hostile rival's military, 0 if it has no
     genuinely hostile relation. This is the fog-of-war system's first
     thread into ongoing policy, not just the one-off war-declaration roll.

     TODO(next-claude): still intentionally simple (5 levers, single-step
     lookahead). Real next steps: multi-turn planning, threading estimates
     into diplomacy_outreach too (see § INTELLIGENCE's own TODO), and
     having "internal government simulation" factions each nudge the score
     instead of one blended identity vector.
  ========================================================================== */
  const POLICIES = ['invest_military', 'invest_tech', 'invest_trade', 'invest_stability', 'diplomacy_outreach'];

  // NEW this session: a real fog-of-war-aware THREAT term, closing the
  // § INTELLIGENCE TODO that decidePolicy() still implicitly saw true
  // stats. Finds c's most hostile relation (if genuinely hostile, < -0.3)
  // and returns c's NOISY ESTIMATE of that rival's military — never the
  // rival's real number. No sufficiently hostile relation -> 0 threat,
  // same as a country with nothing to worry about.
  function estimatedThreatLevel(c) {
    const rels = world.relations[c.iso];
    if (!rels) return 0;
    const worst = Object.entries(rels).sort((a, b) => a[1] - b[1])[0];
    if (!worst || worst[1] >= -0.3) return 0;
    const rival = world.countries[worst[0]];
    if (!rival) return 0;
    return getRivalEstimate(c, rival).military; // cached/possibly-stale, see § INTELLIGENCE
  }

  function decidePolicy(c) {
    const scores = {};
    const threat = estimatedThreatLevel(c); // 0..1, noisy — see helper above
    scores.invest_military = c.identity.military * 0.6 + (1 - c.stats.stability) * 0.2 + threat * 0.25 + rand(0, 0.2);
    scores.invest_tech     = c.identity.tech * 0.6 + c.stats.education * 0.2 + rand(0, 0.2);
    scores.invest_trade    = c.identity.trade * 0.6 + c.stats.tradeOpenness * 0.15 + rand(0, 0.2);
    scores.invest_stability= (1 - c.stats.stability) * 0.7 + rand(0, 0.2);
    scores.diplomacy_outreach = c.identity.diplomacy * 0.6 + (1 - c.identity.isolation) * 0.2 + rand(0, 0.2);

    let best = POLICIES[0];
    for (const p of POLICIES) if (scores[p] > scores[best]) best = p;
    return best;
  }

  function applyPolicy(c, policy) {
    const bump = 0.01 + rand(0, 0.01);
    switch (policy) {
      case 'invest_military':  c.stats.military  = clamp01(c.stats.military  + bump); break;
      case 'invest_tech':      c.stats.tech       = clamp01(c.stats.tech       + bump); break;
      case 'invest_trade':     c.stats.tradeOpenness = clamp01(c.stats.tradeOpenness + bump); break;
      case 'invest_stability': c.stats.stability  = clamp01(c.stats.stability  + bump * 1.4); break;
      case 'diplomacy_outreach': /* handled via relations bump below */ break;
    }
  }

  /* ==========================================================================
     § SIMULATION ENGINE
  ========================================================================== */
  function computeEconomy(c) {
    const base = 0.006; // ~2.4%/yr baseline at quarterly compounding
    const techBoost = c.stats.tech * 0.004;
    const stabilityFactor = (c.stats.stability - 0.5) * 0.006;
    const shock = rand(-0.006, 0.006);
    const growth = base + techBoost + stabilityFactor + shock;
    c.stats.gdp = Math.max(10, c.stats.gdp * (1 + growth));
  }

  function computePopulation(c) {
    const growth = 0.0015 + (c.stats.education - 0.5) * -0.001 + rand(-0.0005, 0.0005);
    c.stats.population = Math.max(0.1, c.stats.population * (1 + growth));
  }

  function computeStability(c) {
    const drift = (c.stats.gdp > 0 ? rand(-0.01, 0.01) : -0.02);
    c.stats.stability = clamp01(c.stats.stability + drift);
  }

  // NEW this session: a genuine (if simplified) inflation-like price-level
  // stat, filling the spec's "GDP, inflation, interest rates" gap that the
  // handoff notes flagged as missing. priceLevel drifts up under demand
  // shocks (food shortages, supply-side crises) and mean-reverts toward
  // 1.0 over time, standing in for a central bank/interest-rate response
  // without modeling rates as their own stat yet.
  // TODO(next-claude): this is still a single scalar, not a real basket of
  // prices, and there's no explicit interest-rate lever a country can pull.
  // A real next step is giving `decidePolicy()` a "tighten/loosen" choice
  // that trades growth for price stability.
  function computeInflation(c) {
    if (typeof c.stats.priceLevel !== 'number') c.stats.priceLevel = 1.0;
    const meanReversion = (1.0 - c.stats.priceLevel) * 0.08;
    const shock = rand(-0.004, 0.004);
    c.stats.priceLevel = Math.max(0.5, c.stats.priceLevel + meanReversion + shock);
  }

  // UPDATED this session: diplomacy_outreach now gates its payoff on the
  // initiator's ESTIMATED read of the target's stability (fog-of-war, see
  // § INTELLIGENCE) instead of a flat +0.01 that implicitly assumed perfect
  // knowledge of who's a good partner. Reaching out to a country you BELIEVE
  // is stable builds more trust per tick than reaching out to one you
  // believe is shaky — and since it's an estimate, that belief can be
  // wrong (a country with excellent tech/relations reads closer to the
  // target's true stability; a country flying blind can misjudge it and
  // over- or under-invest in the relationship). Closes the § INTELLIGENCE
  // TODO that named updateDiplomacy() as the one outstanding call site
  // still reasoning about true stats instead of noisy ones.
  function updateDiplomacy(iso, policy) {
    const isos = Object.keys(world.countries);
    const a = world.countries[iso];
    for (const other of isos) {
      if (other === iso) continue;
      const b = world.countries[other];
      let delta = rand(-0.004, 0.004);
      if (policy === 'diplomacy_outreach') {
        // Noisy, possibly-STALE estimate of the target's stability, never
        // the true value — see getRivalEstimate() in § INTELLIGENCE. Ranges
        // roughly 0.004..0.016, vs. the old flat +0.01, so a believed-stable
        // partner now pays off meaningfully more than a believed-shaky one,
        // and the estimate can be mistaken (or simply out of date) in
        // either direction.
        const believedStability = getRivalEstimate(a, b).stability;
        delta += 0.004 + believedStability * 0.012;
      }
      if (a.region === b.region) delta += 0.002;
      world.relations[iso][other] = clamp(-1, 1, world.relations[iso][other] + delta);
    }
  }

  function tick() {
    world.ticks++;
    for (const iso in world.countries) {
      const c = world.countries[iso];
      computeEconomy(c);
      computePopulation(c);
      computeStability(c);
      computeInflation(c);
      const policy = decidePolicy(c);
      applyPolicy(c, policy);
      updateDiplomacy(iso, policy);
    }
    updateWars();       // advance/resolve active wars, see § WAR
    maybeDeclareWars();  // roll for new war declarations, see § WAR
    tickIntelDecay();    // NEW this session: count down lingering post-war intel fog, see § INTELLIGENCE
    maybeTriggerEvent();
    advanceCalendar();
    refreshMapColors();
    updateUI();
    if (world.ticks % SIM.autosaveEveryTicks === 0) doAutosave();
  }

  function advanceCalendar() {
    world.quarter += SIM.quartersPerTick;
    if (world.quarter > 4) { world.quarter = 1; world.year++; }
    document.getElementById('dateReadout').textContent = `Y${world.year - SIM.startYear + 1} Q${world.quarter} · ${world.year}`;
  }

  /* ==========================================================================
     § EVENTS
     CASCADING CONDITIONS (added this session, first real answer to the
     long-standing "TODO(next-claude): make effects cascade" note).

     Each country now carries `conditions`: a map of conditionName -> ticks
     remaining (see initNewWorld / migrateWorld). Conditions are NOT events
     themselves — they're the *situation* an event leaves behind. Every tick,
     durations count down via tickConditions() and expire on their own.
     EVENT_TABLE entries can:
       - `requires(c, iso)`  — a predicate gating whether the event can even
         be rolled this tick (return false to skip entirely, no roll spent).
         This is how one event's aftermath becomes another event's
         precondition, e.g. `food_shortage` requires `conditions.drought`.
       - `sets`              — array of [conditionName, durationTicks] pairs
         applied via setCondition() when the event fires, seeding the next
         link in the chain.
     This is deliberately still "nothing scripted": which countries actually
     walk the chain, how far, and with what real-world consequence is all
     emergent from the random rolls + existing stat/identity math, not an
     authored script. The chain below approximates the spec's worked example
     (drought → food shortages → protests → government loses popularity →
     policy changes → trade agreements collapse → neighboring economies
     weaken → regional recession) using the stats/conditions this sim
     actually has.

     TODO(next-claude): the chain now covers drought->food shortage->
     inflation->protests->government change->policy shift->trade collapse
     (with a military-spending cut)->regional recession, plus a targeted
     rival-influence gain off government_change and trade_collapse — see
     computeInflation() and grantRivalInfluence(), added this session. Still
     missing/thin: interest rates are not their own lever (priceLevel just
     mean-reverts; there's no policy a country can pick to actively fight
     inflation), grantRivalInfluence() only looks at bilateral relation
     score rather than weighing regional proximity or relative power, and
     the chain still tops out around 8 links / 2 named branches (drought
     and standalone recession) rather than the spec's implied richer web.
     Conditions are shown in the Country tab (see § UI) but not yet on the
     map itself (spec wants the map to visually reflect crises, not just a
     side panel) — still the single highest-value remaining visual gap in
     this system.
  ========================================================================== */
  const CONDITION_LABELS = {
    drought: 'Drought',
    foodShortage: 'Food Shortage',
    unrest: 'Civil Unrest',
    politicalCrisis: 'Political Crisis',
    policyShift: 'Post-Crisis Policy Shift',
    recession: 'Recession',
    regionalRecession: 'Regional Recession',
  };

  function setCondition(c, name, durationTicks) {
    if (!c.conditions) c.conditions = {};
    // refresh to the longer of existing/new duration rather than stacking
    c.conditions[name] = Math.max(c.conditions[name] || 0, durationTicks);
  }

  function tickConditions(c) {
    if (!c.conditions) { c.conditions = {}; return; }
    for (const key in c.conditions) {
      c.conditions[key]--;
      if (c.conditions[key] <= 0) delete c.conditions[key];
    }
  }

  // True if a relation partner of `iso` (relation >= minRelation, i.e. an
  // aligned/friendly economy, standing in for "trade partner") currently
  // carries `condName`. Used for the regional-spread branch of the chain.
  function partnerHasCondition(iso, condName, minRelation = 0.25) {
    const rels = world.relations[iso];
    if (!rels) return false;
    for (const other in rels) {
      if (rels[other] < minRelation) continue;
      const oc = world.countries[other];
      if (oc && oc.conditions && oc.conditions[condName]) return true;
    }
    return false;
  }

  // NEW this session: "rival gains influence" — the spec's worked cascade
  // example explicitly ends with a named rival benefiting from a country's
  // crisis, which previous sessions left as a flat, non-targeted stat
  // change. This looks up `iso`'s most negative (rival) relationship and,
  // if one exists and is genuinely adversarial (relation < -0.15), gives
  // that specific rival a small stability/influence bump plus its own
  // headline — so a crisis in one country now has a named beneficiary
  // instead of just a self-contained penalty.
  // TODO(next-claude): this only considers bilateral relation score. A
  // deeper version would weigh regional proximity and relative power
  // (only a rival that's actually positioned to capitalize should gain).
  function grantRivalInfluence(iso) {
    const rels = world.relations[iso];
    if (!rels) return;
    const worst = Object.entries(rels).sort((a, b) => a[1] - b[1])[0];
    if (!worst || worst[1] >= -0.15) return;
    const rivalIso = worst[0];
    const rival = world.countries[rivalIso];
    if (!rival) return;
    rival.stats.stability = clamp01(rival.stats.stability + 0.02);
    rival.influenceGains = (rival.influenceGains || 0) + 1;
    pushNews(`${rival.name} Gains Regional Influence as ${world.countries[iso].name} Falters`);
  }

  const EVENT_TABLE = [
    { id:'tech_breakthrough', chance:0.03,
      effect:c=>{ c.stats.tech = clamp01(c.stats.tech+0.03); },
      headline:c=>`${c.name} Announces Major Technology Breakthrough` },

    // ---- chain 1: drought -> food shortage -> unrest -> protests ->
    // government change -> policy shift -> trade collapse -> regional
    // recession. Each link requires the previous condition to be active,
    // so this can only play out over several ticks, in order, per country.
    { id:'drought', chance:0.02,
      requires:c=>!c.conditions.drought,
      effect:c=>{ c.stats.stability = clamp01(c.stats.stability-0.03); setCondition(c,'drought',3); },
      headline:c=>`Drought Strains ${c.name}'s Food Supply` },
    { id:'food_shortage', chance:0.22,
      // NEW this session: food shortages now spike the price-level stat
      // (see computeInflation()) instead of only hitting stability
      // directly — this is the missing "inflation" link the spec's worked
      // example named (drought -> food shortages -> inflation -> protests).
      requires:c=>c.conditions.drought && !c.conditions.foodShortage,
      effect:c=>{ c.stats.stability = clamp01(c.stats.stability-0.02); c.stats.priceLevel += 0.12; setCondition(c,'foodShortage',3); },
      headline:c=>`Food Shortages Drive Prices Higher in ${c.name}` },
    { id:'protests', chance:0.3,
      // Now fires off EITHER a lingering food shortage plus real price
      // pain (priceLevel > 1.08), or a standalone recession — matching the
      // spec's "food shortages -> inflation -> protests" chain rather than
      // skipping straight from shortage to unrest.
      requires:c=>((c.conditions.foodShortage && c.stats.priceLevel > 1.08) || c.conditions.recession) && !c.conditions.unrest,
      effect:c=>{ c.stats.stability = clamp01(c.stats.stability-0.05); setCondition(c,'unrest',3); },
      headline:c=>`Mass Protests Erupt in ${c.name} Over Rising Prices` },
    { id:'government_change', chance:0.25,
      requires:c=>c.conditions.unrest && c.stats.stability < 0.45 && !c.conditions.politicalCrisis,
      effect:(c, iso)=>{ c.stats.stability = clamp01(c.stats.stability+0.08); setCondition(c,'politicalCrisis',2); grantRivalInfluence(iso); },
      headline:c=>`${c.name}'s Government Falls Amid Unrest` },
    { id:'policy_shift', chance:0.35,
      requires:c=>c.conditions.politicalCrisis && !c.conditions.policyShift,
      effect:c=>{ setCondition(c,'policyShift',3); },
      headline:c=>`New Leadership in ${c.name} Signals Major Policy Shift` },
    { id:'trade_collapse', chance:0.3,
      // NEW this session: trade collapse now also drags military spending
      // down (the spec's worked example explicitly names "military
      // spending reduced" as a follow-on of the policy-shift/trade branch,
      // which was previously untouched by this chain).
      requires:c=>c.conditions.policyShift,
      effect:(c, iso)=>{ c.stats.tradeOpenness = clamp01(c.stats.tradeOpenness-0.07); c.stats.military = clamp01(c.stats.military-0.03); grantRivalInfluence(iso); },
      headline:c=>`${c.name}'s Trade Agreements Collapse, Military Budget Cut` },
    { id:'regional_recession', chance:0.15,
      requires:(c, iso)=>!c.conditions.recession && partnerHasCondition(iso, 'recession'),
      effect:c=>{ c.stats.gdp *= 0.985; c.stats.stability = clamp01(c.stats.stability-0.02); setCondition(c,'recession',3); setCondition(c,'regionalRecession',2); },
      headline:c=>`Neighboring Downturn Drags on ${c.name}'s Economy` },

    // ---- chain 2: standalone recession (can also feed protests above via
    // the `c.conditions.recession` branch on the 'protests' entry).
    { id:'recession', chance:0.015,
      requires:c=>!c.conditions.recession,
      effect:c=>{ c.stats.gdp *= 0.97; c.stats.stability = clamp01(c.stats.stability-0.03); setCondition(c,'recession',3); },
      headline:c=>`${c.name} Enters Economic Downturn` },

    // ---- one-off / non-cascading events, unchanged in spirit from before.
    { id:'earthquake', chance:0.008,
      effect:c=>{ c.stats.stability = clamp01(c.stats.stability-0.05); },
      headline:c=>`Earthquake Strikes ${c.name}` },
    { id:'trade_deal', chance:0.02,
      effect:c=>{ c.stats.tradeOpenness = clamp01(c.stats.tradeOpenness+0.03); },
      headline:c=>`${c.name} Signs Major Trade Agreement` },
  ];

  function maybeTriggerEvent() {
    const isos = Object.keys(world.countries);
    for (const iso of isos) {
      const c = world.countries[iso];
      tickConditions(c);
    }
    for (const iso of isos) {
      const c = world.countries[iso];
      for (const ev of EVENT_TABLE) {
        if (ev.requires && !ev.requires(c, iso)) continue;
        if (Math.random() < ev.chance) {
          ev.effect(c, iso);
          pushNews(ev.headline(c));
        }
      }
    }
  }

  /* ==========================================================================
     § INTELLIGENCE (fog-of-war)
     Added this session — first real answer to the spec's INTELLIGENCE &
     INFORMATION section ("countries should not have perfect information...
     incorrect intelligence can lead to mistakes and unexpected outcomes"),
     a gap every previous handoff has named on the stubbed list since the
     war system was first built.

     Every country only ever gets a NOISY estimate of another country's
     stats, never the true values. `estimateStat()` adds random error whose
     magnitude scales with the observer's own tech level (better tech =
     sharper intelligence) but never reaches zero — `INTEL.minNoise` is a
     hard floor, so nobody ever gets perfect information, per spec.

     Currently wired into ONE real decision: whether a country feels
     confident enough to start a war (see the confidence check inside
     `warProvocationChance()` in § WAR) — a country compares its OWN true
     military stat against its ESTIMATE of the target's, never the target's
     real number. Get that estimate wrong (bad luck, or just low own-tech)
     and a country can talk itself into a war it can't actually win — a
     genuine "unexpected outcome" per spec, not a scripted twist. That
     failure is tracked as `intelFailures` on the initiator and called out
     with its own distinct news headline in `resolveWar()` (see § WAR)
     instead of being folded into the generic victory headline.

     Session N+5 (this session): closed the two items this section's own
     TODO named — relation/war-aware intel quality, and threading estimates
     into decidePolicy() beyond just war-declaration confidence:
       - `intelNoiseMagnitude()` replaces the flat tech-only noise formula.
         Noise still starts from the observer's own tech (better tech =
         sharper baseline read, unchanged), but now ALSO: a genuinely
         trusting relationship (> 0.3) sharpens the read further (standing
         in for information-sharing between friendly/allied states — the
         spec's "information/intelligence" gap explicitly named allies
         mattering here), while being at war with the SPECIFIC target
         thickens the fog on that read (active-conflict intel is noisier,
         not better) — both per this section's own previous TODO, not
         guesswork.
       - `estimateStat()`/`estimateRival()` now take the target's iso so
         they can look up that relation and war status; every existing
         call site (`warProvocationChance()` in § WAR) updated to pass it.
       - decidePolicy() now takes a THREAT term into its invest_military
         score: a country's ESTIMATE (never the true stat) of its most
         hostile rival's military, when that rival is genuinely hostile
         (relation < -0.3), pulls investment toward the military lever —
         real ongoing policy now reasons with noisy intel about a specific
         rival, not just the war-declaration roll. A country with no
         sufficiently hostile relation gets threat = 0, matching a country
         with nothing to worry about.
     Session N+6 (this session): closed the updateDiplomacy() gap named
     above — diplomacy_outreach's payoff is now gated by the initiator's
     ESTIMATED read of the target's stability (never the true value), so a
     country reaching out to one it BELIEVES is stable builds meaningfully
     more trust per tick than one it believes is shaky, per this section's
     own previous TODO. See § SIMULATION ENGINE's updateDiplomacy() for the
     implementation; every § INTELLIGENCE call site (war-declaration
     confidence, invest_military threat, and now diplomacy_outreach) reads
     estimates, never true stats, closing out this section's original TODO
     list from Session N+5.
     Session N+7 (this session): closed BOTH items the previous TODO named
     — war-noise memory/decay, and estimate persistence across ticks:
       - `recentWarFog` ({targetIso: ticksSinceWarEnded}) is seeded on both
         combatants in `resolveWar()` (§ WAR) the instant a war ends, and
         counted down once per tick by the new `tickIntelDecay()` (called
         from `tick()`). `intelNoiseMagnitude()` now checks it: intel on a
         country you JUST finished fighting stays extra-noisy and decays
         LINEARLY back to the normal relation-based read over
         `INTEL.warFogDecayTicks` (12 ticks / 3 in-sim years), instead of
         snapping instantly back to normal the moment `atWarWith` clears.
         Applies whether the war ended decisively or in a stalemate.
       - `getRivalEstimate(observer, target)` is a new cached wrapper around
         `estimateRival()`: each country keeps a small `intelCache` keyed by
         target ISO (`{tick, military, stability}`). A cached report is
         reused as-is until it's `INTEL.reportRefreshTicks` (4 ticks / ~1
         in-sim year) old, then a fresh roll replaces it. This is a genuine
         "intelligence report going stale" mechanic — a country can now act
         on the SAME (possibly wrong, possibly now-outdated) read across
         many decisions/ticks in a row, rather than the noise silently
         re-rolling and self-averaging on every single call.
       - All three existing fog-of-war call sites — `warProvocationChance()`
         (§ WAR), `estimatedThreatLevel()` (§ COUNTRY AI), and
         `updateDiplomacy()`'s `diplomacy_outreach` payoff (§ SIMULATION
         ENGINE) — now go through `getRivalEstimate()` instead of calling
         `estimateStat()`/`estimateRival()` directly, so all of them share
         the same cached, decaying report rather than each rolling
         independently.
       - `intelCache` / `recentWarFog` added to `initNewWorld()` and
         backfilled in `migrateWorld()` per the standing instruction.
     TODO(next-claude): the UI still doesn't surface any of this — there's
     no "last intel update: Y3 Q2" or "lingering war fog" indicator
     anywhere on the Country tab, so the mechanic is real but invisible to
     the player. A real next step: when a country is selected AND it has an
     entry in `world.countries[selectedIso].recentWarFog` for some other
     country, or a cached-but-stale `intelCache` entry, surface that as a
     small badge similar to the existing Active Conditions row. Also still
     simplified: `intelCache` only holds ONE snapshot per target (the report
     entirely replaces itself on refresh) — there's no history of past
     reports to compare against, so a country can't notice "my estimate of
     X changed a lot since last time," which would be a richer signal than
     just having a single current (possibly stale) number.
  ========================================================================== */
  const INTEL = {
    baseNoise: 0.30, // noise magnitude for an observer with tech = 0
    minNoise: 0.06,  // noise floor for an observer with tech = 1 — nobody gets perfect info
    trustSharpenMax: 0.12, // max noise reduction from a fully-trusting relationship
    warFogPenalty: 0.08,   // extra noise added when observer is at war with the specific target
    warFogDecayTicks: 12,  // NEW this session: after a war with a specific target ends, the
                            // warFogPenalty doesn't vanish instantly — it decays linearly back
                            // to the normal relation-based read over this many ticks (3 in-sim
                            // years). Closes the § INTELLIGENCE TODO that named this by name.
    reportRefreshTicks: 4,  // NEW this session: how often (in ticks) a country's cached read on
                             // a given rival is re-rolled. Between refreshes, `getRivalEstimate()`
                             // reuses the SAME estimate instead of re-rolling every call — a real
                             // "intelligence report going stale" concept, so a lucky/unlucky roll
                             // now compounds across roughly a full in-sim year instead of being
                             // re-randomized on every single decision that happens to check it.
  };

  // NEW this session: noise now depends on WHO is being observed, not just
  // the observer's own tech — see the section note above.
  function intelNoiseMagnitude(observer, targetIso) {
    let noise = INTEL.baseNoise - observer.stats.tech * (INTEL.baseNoise - INTEL.minNoise);
    const rel = world.relations[observer.iso] ? world.relations[observer.iso][targetIso] : undefined;
    if (typeof rel === 'number' && rel > 0.3) {
      noise -= (rel - 0.3) / 0.7 * INTEL.trustSharpenMax; // scales 0..trustSharpenMax as rel goes 0.3..1
    }
    if (observer.atWarWith === targetIso) {
      // actively fighting this specific target — fog is at its worst.
      noise += INTEL.warFogPenalty;
    } else if (observer.recentWarFog && typeof observer.recentWarFog[targetIso] === 'number') {
      // NEW this session: a war with this specific target ended recently —
      // the penalty lingers and decays linearly back to 0 over
      // INTEL.warFogDecayTicks instead of snapping off the instant the war
      // resolves. See resolveWar() in § WAR for where this gets seeded, and
      // tickIntelDecay() below for where it counts down.
      const ticksSince = observer.recentWarFog[targetIso];
      const remainingFrac = Math.max(0, 1 - ticksSince / INTEL.warFogDecayTicks);
      noise += INTEL.warFogPenalty * remainingFrac;
    }
    return clamp(INTEL.minNoise * 0.5, INTEL.baseNoise * 1.4, noise);
  }

  function estimateStat(observer, trueValue, targetIso) {
    const noiseMag = intelNoiseMagnitude(observer, targetIso);
    return clamp01(trueValue + rand(-noiseMag, noiseMag));
  }

  // A country's noisy read on a specific rival's headline stats — never the
  // real numbers, see the section note above. This is the RAW (uncached,
  // always freshly-rolled) reader; most decision code should go through
  // `getRivalEstimate()` below instead, which adds report-staleness on top.
  function estimateRival(observer, target) {
    return {
      military: estimateStat(observer, target.stats.military, target.iso),
      stability: estimateStat(observer, target.stats.stability, target.iso),
    };
  }

  // NEW this session: closes the § INTELLIGENCE TODO on estimate
  // persistence. Rather than re-rolling a fresh noisy read every single
  // time any decision code asks about a rival, each country keeps a small
  // `intelCache` of its last report per target ISO (military, stability,
  // the tick it was taken). A cached report is reused as-is until it's
  // older than INTEL.reportRefreshTicks, at which point a brand new
  // estimateRival() roll replaces it. This means a country can genuinely
  // act on a stale or unlucky report for up to about a year of in-sim
  // time — a real "our intelligence was out of date" failure mode, not
  // just per-decision noise that averages itself out instantly.
  function getRivalEstimate(observer, target) {
    if (!observer.intelCache) observer.intelCache = {};
    const cached = observer.intelCache[target.iso];
    if (cached && (world.ticks - cached.tick) < INTEL.reportRefreshTicks) {
      return cached;
    }
    const fresh = { tick: world.ticks, ...estimateRival(observer, target) };
    observer.intelCache[target.iso] = fresh;
    return fresh;
  }

  // NEW this session: advances the war-fog decay clock (see
  // intelNoiseMagnitude() above) once per tick. Entries are removed once
  // they've fully decayed, rather than left around at 0 forever.
  function tickIntelDecay() {
    for (const iso in world.countries) {
      const fog = world.countries[iso].recentWarFog;
      if (!fog) continue;
      for (const targetIso in fog) {
        fog[targetIso]++;
        if (fog[targetIso] >= INTEL.warFogDecayTicks) delete fog[targetIso];
      }
    }
  }

  /* ==========================================================================
     § WAR
     Added a previous session — first real answer to the spec's MILITARY
     section ("wars require logistics... wars should be uncommon but highly
     impactful") and the "no war system at all" gap every handoff before it
     named explicitly. Deliberately simple on purpose, matching that
     session's scope:
       - a country fights at most ONE war at a time (keeps bookkeeping and
         the UI tractable — no coalition/multi-front logic yet)
       - each side accrues a scalar `warScore` per tick based on militaries
         compared with real randomness applied on both sides (a fog-of-war
         stand-in: raw military stat is NOT a deterministic predictor of who
         "wins" a given tick, only a weighted-average tilt)
       - wars end when one side's military stat collapses (< 0.06), or after
         WAR.maxTicks (4 in-sim years) with either a decisive winner (score
         gap large) or a no-winner ceasefire (score gap small — a real
         stalemate outcome, not every war produces a victor)
       - resolution has real, lasting consequences: winner gets a stability
         bump and a `warsWon` credit; loser takes a much larger stability
         hit plus a trade-openness cut, standing in for war damage/blockade
         effects on the economy

     War declarations are NOT scripted or player-triggered — `maybeDeclareWars()`
     rolls, every tick, for every country not already fighting, against its
     single most-adversarial relationship, gated on that relationship being
     genuinely hostile (below WAR.minRivalRelation). The roll's odds lean on
     identity (military-focused/aggressive-leaning countries and isolationist
     ones pull in opposite directions) and on the target's weakness (a
     target already in a stability crisis is a more tempting target), plus
     the attacker's OWN stability (a country already in crisis is less
     likely to start a war it can't afford) — all per the spec's "every
     country attempts the best decision for itself" core philosophy, not a
     dice roll bolted on top of it.

     TODO(next-claude): this is a real first pass, not the spec's full
     vision. Still missing, by name, versus the MILITARY section above:
       - no separate army/air/navy/cyber/nuclear breakdown — `stats.military`
         is one aggregated number standing in for all of it
       - no logistics, supply lines, terrain, or weather affecting outcomes
       - no coalitions/allies joining a war — strictly bilateral, and only
         one war per country at a time
       - no territory change on victory (there's no territory model at all
         yet — countries are fixed borders from the topojson)
       - the map only shows a pulsing red outline on combatants (`atWar`
         class in refreshMapColors); no actual "military movement
         indicators" per the VISUALS section
       - war declarations aren't yet cross-referenced with the drought/
         recession cascade in § EVENTS (e.g. a government_change or
         trade_collapse making a country MORE likely to draw a war) — a
         natural next link once you're back in this area of the file
  ========================================================================== */
  const WAR = {
    declareChanceBase: 0.0025, // baseline per-tick odds a hostile-enough pair goes to war
    minRivalRelation: -0.55,   // relation must be at least this hostile to be eligible at all
    maxTicks: 16,              // wars are forced to a resolution after 4 in-sim years
    stalemateScoreGap: 0.4,    // score gap below this at maxTicks -> ceasefire, no winner
  };

  function warProvocationChance(c, o) {
    const aggression = c.identity.military * 0.02;
    const isolationPenalty = c.identity.isolation * 0.015;
    // fog-of-war — c never sees o's true stats here, only its own noisy,
    // possibly-STALE estimate (see § INTELLIGENCE's getRivalEstimate()).
    // Bad or out-of-date intel can make a weak target look weaker than it
    // really is, or a strong one look beatable.
    const estO = getRivalEstimate(c, o);
    const opportunism = estO.stability < 0.4 ? 0.01 : 0;         // (estimated) weak target is tempting
    const ownWeakness = c.stats.stability < 0.35 ? -0.01 : 0;    // crisis-ridden countries rarely start wars
    // NEW this session: a country only feels emboldened if it BELIEVES
    // (its estimate, which can be wrong) it holds the military edge. c
    // knows its own true military but only has a noisy read on o's — this
    // is exactly where fog-of-war can cause a real miscalculation, per the
    // spec's "incorrect intelligence can lead to mistakes" language. See
    // resolveWar() for what happens when that miscalculation plays out.
    const perceivedEdge = c.stats.military - estO.military;
    const confidence = perceivedEdge > 0 ? 0.012 : -0.008;
    return Math.max(0, WAR.declareChanceBase + aggression - isolationPenalty + opportunism + ownWeakness + confidence);
  }

  function maybeDeclareWars() {
    for (const iso in world.countries) {
      const c = world.countries[iso];
      if (c.atWarWith) continue; // already fighting — one war at a time, see § WAR note
      const rels = world.relations[iso];
      if (!rels) continue;
      const worst = Object.entries(rels).sort((a, b) => a[1] - b[1])[0];
      if (!worst || worst[1] >= WAR.minRivalRelation) continue;
      const oIso = worst[0];
      const o = world.countries[oIso];
      if (!o || o.atWarWith) continue;
      if (Math.random() < warProvocationChance(c, o)) startWar(iso, oIso);
    }
  }

  function startWar(aIso, bIso) {
    const a = world.countries[aIso], b = world.countries[bIso];
    const war = {
      id: `${aIso}_${bIso}_${world.ticks}`, a: aIso, b: bIso,
      aScore: 0, bScore: 0, ticks: 0,
      startYear: world.year, startQuarter: world.quarter,
      initiator: aIso, // NEW this session: who declared this war — see
                        // § INTELLIGENCE, used by resolveWar() to flag a
                        // fog-of-war miscalculation if the initiator loses.
    };
    world.wars.push(war);
    a.atWarWith = bIso; b.atWarWith = aIso;
    a.warsFought = (a.warsFought || 0) + 1;
    b.warsFought = (b.warsFought || 0) + 1;
    world.relations[aIso][bIso] = clamp(-1, 1, Math.min(world.relations[aIso][bIso], -0.7));
    world.relations[bIso][aIso] = clamp(-1, 1, Math.min(world.relations[bIso][aIso], -0.7));
    pushNews(`${a.name} Declares War on ${b.name}`);
  }

  function updateWars() {
    for (let i = world.wars.length - 1; i >= 0; i--) {
      const war = world.wars[i];
      const a = world.countries[war.a], b = world.countries[war.b];
      if (!a || !b) { world.wars.splice(i, 1); continue; } // guard against a stale/migrated save
      // fog-of-war-ish tick: applied power is noisy, not a clean stat compare.
      const aPower = a.stats.military * (0.6 + rand(0, 0.8));
      const bPower = b.stats.military * (0.6 + rand(0, 0.8));
      if (aPower > bPower) war.aScore += (aPower - bPower); else war.bScore += (bPower - aPower);
      war.ticks++;

      a.stats.military = clamp01(a.stats.military - 0.015 - rand(0, 0.015));
      b.stats.military = clamp01(b.stats.military - 0.015 - rand(0, 0.015));
      a.stats.gdp *= 0.99; b.stats.gdp *= 0.99;
      a.stats.stability = clamp01(a.stats.stability - 0.015);
      b.stats.stability = clamp01(b.stats.stability - 0.015);

      const scoreGap = Math.abs(war.aScore - war.bScore);
      const decisive = a.stats.military < 0.06 || b.stats.military < 0.06;
      if (decisive || war.ticks >= WAR.maxTicks) {
        resolveWar(war, !decisive && scoreGap < WAR.stalemateScoreGap);
        world.wars.splice(i, 1);
      }
    }
  }

  function resolveWar(war, stalemate) {
    const a = world.countries[war.a], b = world.countries[war.b];
    a.atWarWith = null; b.atWarWith = null;
    // NEW this session: seed the war-fog decay clock (see § INTELLIGENCE's
    // intelNoiseMagnitude()/tickIntelDecay()) for BOTH sides against each
    // other. Intel on a country you just finished fighting stays noisier
    // than normal for a while — it doesn't snap back to a clean read the
    // instant the shooting stops — and this applies whether the war ended
    // decisively or in a stalemate.
    if (!a.recentWarFog) a.recentWarFog = {};
    if (!b.recentWarFog) b.recentWarFog = {};
    a.recentWarFog[war.b] = 0;
    b.recentWarFog[war.a] = 0;
    if (stalemate) {
      a.stats.stability = clamp01(a.stats.stability + 0.02);
      b.stats.stability = clamp01(b.stats.stability + 0.02);
      pushNews(`${a.name} and ${b.name} Agree to Ceasefire After Years of Fighting`);
      return;
    }
    const aWon = (a.stats.military < 0.06 && b.stats.military >= 0.06) ? false
               : (b.stats.military < 0.06 && a.stats.military >= 0.06) ? true
               : war.aScore > war.bScore;
    const winner = aWon ? a : b, loser = aWon ? b : a;
    winner.stats.stability = clamp01(winner.stats.stability + 0.05);
    winner.warsWon = (winner.warsWon || 0) + 1;
    loser.stats.stability = clamp01(loser.stats.stability - 0.12);
    loser.stats.tradeOpenness = clamp01(loser.stats.tradeOpenness - 0.08);
    // NEW this session: if the country that STARTED this war is also the
    // one that LOST it, that's a real fog-of-war miscalculation (see
    // § INTELLIGENCE) — the attacker's estimate of the target said the war
    // was winnable, and the estimate was wrong. Track it and call it out
    // by name instead of folding it into the generic victory headline.
    // `war.initiator` is missing on wars that were already in progress in
    // a save from before this session existed; the check below is just
    // false in that case, which is the correct, safe fallback.
    if (war.initiator && world.countries[war.initiator] === loser) {
      loser.intelFailures = (loser.intelFailures || 0) + 1;
      pushNews(`${winner.name} Emerges Victorious as ${loser.name} Misjudged Its Odds`);
    } else {
      pushNews(`${winner.name} Emerges Victorious in War With ${loser.name}`);
    }
  }

  /* ==========================================================================
     § NEWS
  ========================================================================== */
  function pushNews(text) {
    world.newsLog.unshift({ when: `Y${world.year} Q${world.quarter}`, text });
    if (world.newsLog.length > 300) world.newsLog.length = 300;
    renderTicker();
    if (currentTab === 'timeline') renderTimelineTab();
  }

  function renderTicker() {
    const items = world.newsLog.slice(0, 12).map(n => `<b>${n.when}</b> ${escapeHtml(n.text)}`);
    document.getElementById('tickerInner').innerHTML = items.length
      ? items.join('&nbsp;&nbsp;•&nbsp;&nbsp;')
      : 'World simulation running…';
  }

  /* ==========================================================================
     § MAP  (D3 + topojson, loaded from CDN)
     TODO(next-claude): the world-atlas countries-110m.json in use is a LOW
     resolution atlas (110m = simplified for small file size / fast render).
     It's fine for large/medium countries but drops or barely-renders many
     Pacific and Caribbean micro-states, which caps the visible payoff of
     adding more COUNTRY_DATA entries for those nations. If country-count
     coverage keeps growing, consider swapping to world-atlas's 50m variant
     (still CDN-loadable, larger file, more shapes resolved) as a distinct,
     separately-tested change — don't do it casually alongside unrelated
     edits since it touches every render path.
  ========================================================================== */
  let d3lib, topojsonlib;
  let svg, gLand, gNodes, gLines, projection, path, zoomBehavior;
  let worldTopology, countryFeatures;
  let currentMapMode = 'political';

  async function loadMapLibs() {
    // Dynamic import from CDN so the whole file still works with zero build step.
    d3lib = await import('https://cdn.jsdelivr.net/npm/d3@7/+esm');
    topojsonlib = await import('https://cdn.jsdelivr.net/npm/topojson-client@3/+esm');
  }

  async function initMap() {
    await loadMapLibs();
    const res = await fetch(TOPOJSON_URL);
    worldTopology = await res.json();
    countryFeatures = topojsonlib.feature(worldTopology, worldTopology.objects.countries).features;

    const el = document.getElementById('mapPanel');
    const w = el.clientWidth, h = el.clientHeight;

    svg = d3lib.select('#worldMap').attr('viewBox', `0 0 ${w} ${h}`);
    const zoomLayer = svg.append('g');
    gLines = zoomLayer.append('g').attr('class', 'linesLayer');
    gLand  = zoomLayer.append('g').attr('class', 'landLayer');
    gNodes = zoomLayer.append('g').attr('class', 'nodesLayer');

    projection = d3lib.geoNaturalEarth1().fitSize([w, h], { type: 'Sphere' });
    path = d3lib.geoPath(projection);

    gLand.selectAll('path')
      .data(countryFeatures)
      .join('path')
      .attr('class', d => 'land' + (COUNTRY_DATA[d.id] ? ' sim' : ''))
      .attr('d', path)
      .on('click', (event, d) => selectCountry(d.id));

    zoomBehavior = d3lib.zoom().scaleExtent([1, 8]).on('zoom', (event) => {
      zoomLayer.attr('transform', event.transform);
    });
    svg.call(zoomBehavior);

    drawCapitalNodes();
    refreshMapColors();
  }

  function drawCapitalNodes() {
    // Approximate centroid-based placement (real capital lat/lon is a nice
    // TODO(next-claude) upgrade — centroid is good enough for a first pass).
    const nodeData = countryFeatures
      .filter(f => COUNTRY_DATA[f.id])
      .map(f => ({ iso: f.id, centroid: path.centroid(f) }));

    gNodes.selectAll('g.capitalNode')
      .data(nodeData, d => d.iso)
      .join(enter => {
        const g = enter.append('g').attr('class', 'capitalNode')
          .attr('transform', d => `translate(${d.centroid[0]},${d.centroid[1]})`)
          .on('click', (event, d) => selectCountry(d.iso));
        g.append('circle').attr('class', 'ring').attr('r', 2);
        g.append('circle').attr('class', 'core').attr('r', d => nodeRadius(d.iso));
        return g;
      });
  }

  function nodeRadius(iso) {
    const gdp = COUNTRY_DATA[iso] ? world?.countries?.[iso]?.stats?.gdp ?? COUNTRY_DATA[iso].stats.gdp : 100;
    return clamp(2, 7, Math.sqrt(gdp) / 60);
  }

  function applyMapMode(mode) {
    currentMapMode = mode;
    document.querySelectorAll('.modeBtn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    refreshMapColors();
  }

  function refreshMapColors() {
    if (!gLand) return;
    const regionColor = d3lib.scaleOrdinal()
      .domain(['Americas','Europe','Asia','Middle East','Africa','Oceania','Europe/Asia'])
      .range(['#3FC1C9','#7C9CE0','#E0A458','#C97BD1','#4FD1A5','#6FE0D0','#8896D6']);
    const gdpExtent = d3lib.extent(Object.values(world.countries), c => c.stats.gdp);
    const gdpColor = d3lib.scaleSequential(d3lib.interpolateYlOrRd).domain(gdpExtent);
    // Military/tech stats are already normalized 0-1, so these two scales are
    // fixed-domain rather than data-extent — keeps a country's color legible
    // as a stable "how militarized / how advanced" reading, not a relative rank.
    const militaryColor = d3lib.scaleSequential(d3lib.interpolateReds).domain([0, 1]);
    const techColor = d3lib.scaleSequential(d3lib.interpolateBlues).domain([0, 1]);
    // NEW this session: Trade mode uses the real `stats.tradeOpenness` field
    // that has existed on every country since COUNTRY_DATA was written (and
    // is already surfaced on the Country tab) — a genuine data-backed map
    // mode, not a proxy off an unrelated stat. Fixed 0-1 domain for the same
    // "stable legible reading, not relative rank" reason as military/tech.
    const tradeColor = d3lib.scaleSequential(d3lib.interpolateGreens).domain([0, 1]);
    // TODO(next-claude): climate mode needs a real per-country climate-risk /
    // emissions data model (see spec's GEOGRAPHY + GLOBAL EVENTS sections) —
    // there's no such field on COUNTRY_DATA yet, so it stays disabled rather
    // than faking it off an unrelated stat.

    gLand.selectAll('path')
      .attr('fill', d => {
        const c = world.countries[d.id];
        if (!c) return 'var(--panel-2)';
        if (currentMapMode === 'economic') return gdpColor(c.stats.gdp);
        if (currentMapMode === 'military') return militaryColor(c.stats.military);
        if (currentMapMode === 'tech') return techColor(c.stats.tech);
        if (currentMapMode === 'trade') return tradeColor(c.stats.tradeOpenness ?? 0.5);
        return regionColor(c.region);
      })
      .attr('class', d => 'land'
        + (world.countries[d.id] ? ' sim' : '')
        + (d.id === world.selectedIso ? ' selected' : '')
        + (world.countries[d.id]?.atWarWith ? ' atWar' : '')); // NEW this session, see § WAR

    gNodes.selectAll('circle.core').attr('r', d => nodeRadius(d.iso));
  }

  // TODO(next-claude): flesh this out — currently a minimal starting point
  // for the spec's "moving trade routes / alliance visuals" requirement.
  function renderRelationLines() {
    if (!gLines || !world.selectedIso) { gLines?.selectAll('*').remove(); return; }
    const iso = world.selectedIso;
    const rels = world.relations[iso] || {};
    const nodeByIso = {};
    countryFeatures.forEach(f => { if (COUNTRY_DATA[f.id]) nodeByIso[f.id] = path.centroid(f); });
    const lines = Object.entries(rels)
      .filter(([, v]) => Math.abs(v) > 0.3 && nodeByIso[iso])
      .map(([other, v]) => ({ from: nodeByIso[iso], to: nodeByIso[other], good: v > 0 }))
      .filter(l => l.to);

    gLines.selectAll('line')
      .data(lines)
      .join('line')
      .attr('class', d => d.good ? 'allyLine' : 'rivalLine')
      .attr('x1', d => d.from[0]).attr('y1', d => d.from[1])
      .attr('x2', d => d.to[0]).attr('y2', d => d.to[1]);
  }

  function selectCountry(iso) {
    if (!world.countries[iso]) return;
    world.selectedIso = iso;
    refreshMapColors();
    renderRelationLines();
    switchTab('country');
  }

  /* ==========================================================================
     § UI
  ========================================================================== */
  let currentTab = 'world';

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (tab === 'world') renderWorldTab();
    else if (tab === 'country') renderCountryTab();
    else if (tab === 'timeline') renderTimelineTab();
  }

  function statRow(k, v, cls) {
    return `<div class="statRow"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`;
  }

  function renderWorldTab() {
    const cs = Object.values(world.countries);
    const totalGdp = cs.reduce((s, c) => s + c.stats.gdp, 0);
    const totalPop = cs.reduce((s, c) => s + c.stats.population, 0);
    const avgStability = cs.reduce((s, c) => s + c.stats.stability, 0) / cs.length;
    const avgTech = cs.reduce((s, c) => s + c.stats.tech, 0) / cs.length;
    // NEW this session: world-average price level, surfaced as an
    // inflation readout now that computeInflation() exists.
    const avgPriceLevel = cs.reduce((s, c) => s + (c.stats.priceLevel ?? 1), 0) / cs.length;
    const top = [...cs].sort((a,b) => b.stats.gdp - a.stats.gdp).slice(0, 5);

    document.getElementById('tabContent').innerHTML = `
      <p class="panelTitle">World Overview</p>
      <p class="panelSub">${cs.length} simulated nations · ${countryFeatures?.length ?? '—'} on map</p>
      ${statRow('World GDP', '$' + Math.round(totalGdp).toLocaleString() + 'B')}
      ${statRow('World Population', Math.round(totalPop).toLocaleString() + 'M')}
      ${statRow('Avg. Stability', Math.round(avgStability*100) + '%')}
      ${statRow('Avg. Tech Level', Math.round(avgTech*100) + '%')}
      ${statRow('Avg. Inflation', (avgPriceLevel >= 1 ? '+' : '') + Math.round((avgPriceLevel-1)*100) + '%', avgPriceLevel > 1.08 ? 'down' : '')}
      ${statRow('Active Conflicts', String(world.wars.length), world.wars.length ? 'down' : '')}
      <p class="panelTitle" style="margin-top:20px;font-size:14px;">Top Economies</p>
      ${top.map(c => statRow(c.name, '$' + Math.round(c.stats.gdp).toLocaleString() + 'B')).join('')}
      ${renderActiveWars()}
    `;
  }

  // NEW this session: lists active wars on the World tab, see § WAR.
  function renderActiveWars() {
    if (!world.wars.length) return '';
    const rows = world.wars.map(w => {
      const a = world.countries[w.a], b = world.countries[w.b];
      if (!a || !b) return '';
      return statRow(`${a.name} vs ${b.name}`, `Q${w.ticks}`, 'down');
    }).join('');
    return `<p class="panelTitle" style="margin-top:20px;font-size:14px;">Active Wars</p>${rows}`;
  }

  function renderCountryTab() {
    const iso = world.selectedIso;
    const el = document.getElementById('tabContent');
    if (!iso || !world.countries[iso]) {
      el.innerHTML = `<div class="emptyState">Click a country on the map to inspect it.</div>`;
      return;
    }
    const c = world.countries[iso];
    const rels = world.relations[iso] || {};
    const bestFriend = Object.entries(rels).sort((a,b)=>b[1]-a[1])[0];
    const worstRival = Object.entries(rels).sort((a,b)=>a[1]-b[1])[0];

    el.innerHTML = `
      <p class="panelTitle">${c.name}</p>
      <p class="panelSub">${c.region}</p>
      ${statRow('GDP', '$' + Math.round(c.stats.gdp).toLocaleString() + 'B')}
      ${statRow('Population', Math.round(c.stats.population).toLocaleString() + 'M')}
      ${statRow('Stability', Math.round(c.stats.stability*100) + '%')}
      ${statRow('Military', Math.round(c.stats.military*100) + '%')}
      ${statRow('Technology', Math.round(c.stats.tech*100) + '%')}
      ${statRow('Education', Math.round(c.stats.education*100) + '%')}
      ${statRow('Trade Openness', Math.round(c.stats.tradeOpenness*100) + '%')}
      ${statRow('Inflation', ((c.stats.priceLevel ?? 1) >= 1 ? '+' : '') + Math.round(((c.stats.priceLevel ?? 1)-1)*100) + '%', (c.stats.priceLevel ?? 1) > 1.08 ? 'down' : '')}
      ${c.influenceGains ? statRow('Rival Crises Capitalized On', String(c.influenceGains), 'up') : ''}
      ${c.atWarWith && world.countries[c.atWarWith] ? statRow('At War With', world.countries[c.atWarWith].name, 'down') : ''}
      ${c.warsFought ? statRow('Wars Fought', `${c.warsFought} (${c.warsWon || 0} won)`) : ''}
      ${c.intelFailures ? statRow('Intelligence Failures', String(c.intelFailures), 'down') : ''}
      ${bestFriend ? statRow('Closest Relationship', world.countries[bestFriend[0]]?.name ?? bestFriend[0], 'up') : ''}
      ${worstRival && worstRival[1] < 0 ? statRow('Most Tense Relationship', world.countries[worstRival[0]]?.name ?? worstRival[0], 'down') : ''}
      ${renderConditions(c)}
    `;
  }

  // Active situational conditions (see § EVENTS) shown as small badges so
  // the drought->unrest->government-change->... cascade is actually visible
  // to the player, not just internal state.
  function renderConditions(c) {
    const active = Object.keys(c.conditions || {});
    if (!active.length) return '';
    const badges = active.map(k =>
      `<span class="condBadge">${escapeHtml(CONDITION_LABELS[k] || k)}</span>`
    ).join('');
    return `<p class="panelTitle" style="margin-top:20px;font-size:14px;">Active Conditions</p><div class="condRow">${badges}</div>`;
  }

  function renderTimelineTab() {
    const el = document.getElementById('tabContent');
    if (!world.newsLog.length) {
      el.innerHTML = `<div class="emptyState">No history yet — press play.</div>`;
      return;
    }
    el.innerHTML = world.newsLog.map(n =>
      `<div class="newsItem"><span class="when">${n.when}</span>${escapeHtml(n.text)}</div>`
    ).join('');
  }

  function updateUI() {
    if (currentTab === 'world') renderWorldTab();
    else if (currentTab === 'country') renderCountryTab();
    // timeline updates itself via pushNews()
  }

  /* ==========================================================================
     § BOOTSTRAP
  ========================================================================== */
  let playing = false;
  let speed = 2;
  let loopHandle = null;

  function startLoop() {
    stopLoop();
    const perSecond = SIM.ticksPerSecondBySpeed[speed] ?? 1;
    loopHandle = setInterval(tick, 1000 / perSecond);
  }
  function stopLoop() { if (loopHandle) clearInterval(loopHandle); loopHandle = null; }

  async function doAutosave() {
    const user = auth.currentUser;
    if (!user) return;
    document.getElementById('saveStatus').textContent = 'Saving…';
    try {
      await saveWorld(user.uid, world);
      document.getElementById('saveStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
    } catch (e) {
      console.error(e);
      document.getElementById('saveStatus').textContent = 'Save failed';
    }
  }

  function wireUI() {
    document.getElementById('playBtn').addEventListener('click', () => {
      playing = !playing;
      document.getElementById('playBtn').textContent = playing ? '❚❚' : '▶';
      if (playing) startLoop(); else stopLoop();
    });

    document.querySelectorAll('.speedBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        speed = Number(btn.dataset.speed);
        document.querySelectorAll('.speedBtn').forEach(b => b.classList.toggle('active', b === btn));
        if (playing) startLoop();
      });
    });

    document.querySelectorAll('.modeBtn').forEach(btn => {
      btn.addEventListener('click', () => { if (!btn.disabled) applyMapMode(btn.dataset.mode); });
    });

    document.querySelectorAll('.tabBtn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.getElementById('saveBtn').addEventListener('click', doAutosave);

    document.getElementById('newWorldBtn').addEventListener('click', () => {
      if (!confirm('Start a fresh world? This resets the simulation (your last save is untouched until you press Save Now).')) return;
      world = initNewWorld();
      world.selectedIso = null;
      refreshMapColors();
      switchTab('world');
      renderTicker();
    });

    document.getElementById('signOutBtn').addEventListener('click', () => { stopLoop(); playing = false; signOut(auth); });
  }

  function wireAuthUI() {
    const err = document.getElementById('authError');
    const show = (msg) => { err.textContent = msg; };

    document.getElementById('signInBtn').addEventListener('click', async () => {
      show('');
      try {
        await signInWithEmailAndPassword(auth, val('emailInput'), val('passInput'));
      } catch (e) { show(friendlyAuthError(e)); }
    });
    document.getElementById('signUpBtn').addEventListener('click', async () => {
      show('');
      try {
        await createUserWithEmailAndPassword(auth, val('emailInput'), val('passInput'));
      } catch (e) { show(friendlyAuthError(e)); }
    });
    document.getElementById('anonBtn').addEventListener('click', async () => {
      show('');
      try { await signInAnonymously(auth); } catch (e) { show(friendlyAuthError(e)); }
    });
  }

  function friendlyAuthError(e) {
    const code = e?.code || '';
    if (code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
    if (code.includes('email-already-in-use')) return 'An account with that email already exists.';
    if (code.includes('weak-password')) return 'Password should be at least 6 characters.';
    if (code.includes('invalid-email')) return 'That email address looks invalid.';
    return 'Something went wrong. Please try again.';
  }

  async function onSignedIn(user) {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.querySelector('#userBadge .email').textContent = user.isAnonymous ? 'Anonymous session' : (user.email || '');

    document.getElementById('tabContent').innerHTML = `<div class="emptyState">Loading world…</div>`;

    const saved = await loadWorld(user.uid).catch(() => null);
    world = saved ? { ...initNewWorld(), ...saved, selectedIso: null, ticks: 0 } : initNewWorld();
    migrateWorld(world);

    await initMap();
    renderTicker();
    switchTab('world');
    document.getElementById('dateReadout').textContent = `Y${world.year - SIM.startYear + 1} Q${world.quarter} · ${world.year}`;
  }

  function onSignedOut() {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('emailInput').value = '';
    document.getElementById('passInput').value = '';
  }

  onAuthStateChanged(auth, (user) => { user ? onSignedIn(user) : onSignedOut(); });

  document.addEventListener('DOMContentLoaded', () => {
    wireAuthUI();
    wireUI();
  });

  /* ==========================================================================
     § UTILITIES
  ========================================================================== */
  function rand(min, max) { return min + Math.random() * (max - min); }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function clamp(min, max, v) { return Math.max(min, Math.min(max, v)); }
  function val(id) { return document.getElementById(id).value; }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

</script>
</body>
</html>
